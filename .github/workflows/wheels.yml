name: Linux wheels

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/wheels.yml"
      - "pyproject.toml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "scripts/**"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/wheels.yml"
      - "pyproject.toml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: CPython ${{ matrix.python }} manylinux x86_64
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["cp310", "cp311", "cp312", "cp313"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build, repair, and test wheel
        env:
          CIBW_BUILD: ${{ matrix.python }}-manylinux_x86_64
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cibuildwheel==4.2.1"
          python -m cibuildwheel --output-dir wheelhouse

      - name: Check wheel metadata
        run: |
          python -m pip install twine
          python -m twine check wheelhouse/*.whl
          wheel_file="$(find wheelhouse -maxdepth 1 -name '*.whl' -print -quit)"
          case "$wheel_file" in
            *manylinux*x86_64.whl) ;;
            *) echo "Wheel was not repaired to a manylinux x86_64 tag: $wheel_file" >&2; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: equiload-${{ matrix.python }}-manylinux-x86_64
          path: wheelhouse/*.whl
          if-no-files-found: error
