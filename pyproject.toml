[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "rtorch"
dynamic = ["version"]
description = "Python bindings for RTorch tensor loading"
requires-python = ">=3.9"
license = { file = "LICENSE" }

[tool.maturin]
manifest-path = "crates/rtorch-python/Cargo.toml"
module-name = "rtorch"
