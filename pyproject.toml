[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "equiload"
dynamic = ["version"]
description = "Native HDF5 graph loader for Equitrain and PyTorch Geometric"
requires-python = ">=3.9"
license = { file = "LICENSE" }
readme = "README.md"
dependencies = ["torch", "torch-geometric"]

[tool.maturin]
manifest-path = "crates/equiload-python/Cargo.toml"
module-name = "equiload"
