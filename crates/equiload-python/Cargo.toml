[package]
name = "equiload-python"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "equiload"
crate-type = ["cdylib"]
# This crate is tested through Python (pytest).  Building a Rust test binary
# for an extension-module crate omits libpython and fails to link PyO3 symbols.
test = false
doctest = false

[features]
default = []
hdf5 = ["equiload-core/hdf5"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
equiload-core = { package = "equiload", path = "../equiload" }
