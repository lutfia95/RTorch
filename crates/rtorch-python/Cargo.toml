[package]
name = "rtorch-python"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "rtorch"
crate-type = ["cdylib"]
# This crate is tested through Python (pytest).  Building a Rust test binary
# for an extension-module crate omits libpython and fails to link PyO3 symbols.
test = false
doctest = false

[features]
default = []
hdf5 = ["rtorch-core/hdf5"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rtorch-core = { package = "rtorch", path = "../rtorch" }
